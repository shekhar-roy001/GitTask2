<!DOCTYPE html>
<html>
    <head>
        <title>Teacher Registration</title>
    </head>
    <link rel="stylesheet" type="text/css" href="coloringg.css">
    <body>
        <form>
                <label for="fname">Fist Name: </label>
                <input type="fname">
                <br><br>
                <label for="lname">Last Name: </label>
                <input type="lname">
                <br><br>
                <label for="gender">Gender: </label>
                <input type="radio">Male
                <input type="radio">Female <br><br>
                <label for="dob">Date of Birth: </label>
                <input type="date"><br><br>
                <label for="phone">Phone: </label>
                <input type="tel"><br><br>
                <label for="email">Email: </label>
                <input type="email"><br><br>
                <label for="dept">Department: </label>
                <select id="dept">
                    <option>FST</option>
                    <option>FBA</option>
                    <option>FE</option>
                    <option>FASS</option>
                </select>
                <br><br>
                <label for="experience">Experience</label>
                <input type="number"><br><br>
                <label for="password">Password: </label>
                <input type="password">
                <br><br>
                <label for="password">Confirm Password: </label>
                <input type="password">
                <br><br>
                
                <input type="checkbox">
                <label for="checkbox">I agree to the terms and privacy policy</label><br>
                <button class="btn" type="submit">Create account</button>
                <br>
                <p class="alt">Already registered? <a href="login.html">Log in</a></p>
    </body>
</html>
